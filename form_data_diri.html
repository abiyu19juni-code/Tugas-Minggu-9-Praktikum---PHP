<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f1f1;
            margin: 0;
            padding: 32px 16px;
        }
        main {
            max-width: 520px;
            margin: auto;
            padding: 24px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px #0002;
        }
        h1 { margin: 0 0 24px; font-size: 28px; }
        .label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], input[type="date"] {
            box-sizing: border-box;
            width: 100%;
            padding: 9px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font: inherit;
        }
        fieldset { border: 0; margin: 0 0 16px; padding: 0; }
        legend { font-weight: bold; margin-bottom: 8px; padding: 0; }
        fieldset label { display: block; margin-bottom: 6px; }
        button {
            background: #007bff;
            color: white;
            border: 0;
            border-radius: 4px;
            padding: 10px 16px;
            font: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Formulir Data Diri</h1>
        <form action="proses_data_diri.php" method="POST">
            <label class="label" for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>
            <label class="label" for="tanggal_lahir">Tanggal Lahir:</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
            <fieldset>
                <legend>Hobi:</legend>
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </fieldset>
            <button type="submit">Kirim</button>
        </form>
    </main>
</body>
</html>
